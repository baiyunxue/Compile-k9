name: 云编译OpenWrt
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential asciidoc binutils bzip2 gawk gettext git libncurses5-dev libz-dev patch python3 python3-pip unzip zlib1g-dev lib32gcc1 libc6-dev-i386 subversion flex uglifyjs git-core gcc-multilib p7zip p7zip-full msmtp libssl-dev texinfo libglib2.0-dev xmlto qemu-utils upx libelf-dev autoconf automake libtool autopoint device-tree-compiler wget libarchive-dev

      - name: 拉取OpenWrt主线源码
        run: |
          git clone https://git.openwrt.org/openwrt/openwrt.git openwrt
          cd openwrt
          git checkout main

      - name: 添加kiddin9软件源
        run: |
          cd openwrt
          sed -i '$a src-git kiddin9 https://github.com/kiddin9/openwrt-packages' feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 导入你的.config配置
        run: |
          cd openwrt
          cp ../configs/op-MT7981.config
          make defconfig

      - name: 释放磁盘空间（解决云编译磁盘不足）
        run: |
          cd openwrt
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h

      - name: 预下载源码包
        run: |
          cd openwrt
          make download -j8

      - name: 编译固件
        run: |
          cd openwrt
          make -j1 V=s

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: XR30-EMMC-OpenWrt-Firmware
          path: |
            openwrt/bin/targets/mediatek/filogic/*
            openwrt/.config
